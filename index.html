<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./payoo.png" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>payoo</title>
  </head>
  <body class="bg-[#F4F5F7]">
    <div
      class="flex justify-center items-center flex-col w-[400px] mx-auto h-[100vh]"
    >
      <div
        class="flex justify-center items-center bg-[url('./assets/bg.png')] bg-no-repeat bg-cover w-full h-[150px]"
      >
        <img src="./assets/Group.png" alt="group-image" />
      </div>
      <form
        id="login_form"
        class="bg-white p-6 rounded-lg shadow-md w-full flex flex-col gap-4"
      >
        <fieldset class="fieldset flex flex-col gap-2 border-none p-0 m-0">
          <label
            class="label font-bold text-base text-black"
            for="mobile_number"
          >
            Mobile Number
          </label>

          <input
            type="tel"
            id="mobile_number"
            name="mobile_number"
            inputmode="numeric"
            autocomplete="tel"
            minlength="11"
            maxlength="11"
            pattern="01[3-9]\d{8}"
            title="Please enter an 11-digit mobile number (e.g., 01712345678)"
            required
            placeholder="Mobile Number"
            class="input placeholder-black/50 border-none bg-[#F4F5F7] p-4 rounded-full w-full text-sm focus:outline-none"
          />
        </fieldset>

        <fieldset class="fieldset flex flex-col gap-2 border-none p-0 m-0">
          <label class="label font-bold text-base text-black" for="login_pin">
            Pin Number
          </label>
          <input
            type="password"
            id="login_pin"
            name="login_pin"
            inputmode="numeric"
            autocomplete="current-password"
            minlength="4"
            maxlength="4"
            pattern="\d{4}"
            title="Please enter a 4-digit PIN"
            required
            placeholder="Enter 4 digit pin number"
            class="input placeholder-black/50 border-none bg-[#F4F5F7] p-4 rounded-full w-full text-sm focus:outline-none"
          />
        </fieldset>

        <button
          id="login_button"
          type="submit"
          class="btn mt-3 bg-blue-500 hover:bg-blue-700 text-white font-semibold py-3 border-none rounded-full w-full cursor-pointer transition-colors"
        >
          Login
        </button>
      </form>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
